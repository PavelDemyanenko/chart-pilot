apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-opensearch-connector
  namespace: chart-pilot
  labels:
    app: pg-opensearch-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-opensearch-connector
  template:
    metadata:
      labels:
        app: pg-opensearch-connector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: pg-opensearch-connector
          image: pg-opensearch-connector:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PG_JDBC_URL
              value: jdbc:postgresql://postgres:5432/chartpilot
            - name: PG_USER
              value: chartpilot
            - name: PG_PASSWORD
              value: chartpilot
            - name: OPENSEARCH_URL
              value: http://opensearch:9200
            - name: CONNECTOR_POLL_INTERVAL_MS
              value: "5000"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "640Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pg-opensearch-connector
  namespace: chart-pilot
spec:
  selector:
    app: pg-opensearch-connector
  ports:
    - port: 8080
      targetPort: 8080