apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: chart-pilot
  labels:
    app: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: osd-chart-pilot:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5601
          env:
            - name: AG_UI_URL
              valueFrom:
                configMapKeyRef:
                  name: osd-agui-config
                  key: AG_UI_URL
            - name: AGENT_ID
              valueFrom:
                configMapKeyRef:
                  name: osd-agui-config
                  key: AGENT_ID
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /app/home
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: chart-pilot
spec:
  type: NodePort
  selector:
    app: opensearch-dashboards
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30560