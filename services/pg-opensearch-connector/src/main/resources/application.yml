spring:
  application:
    name: pg-opensearch-connector
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PG_JDBC_URL:jdbc:postgresql://localhost:5432/chartpilot}
    username: ${PG_USER:chartpilot}
    password: ${PG_PASSWORD:chartpilot}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      max-lifetime: 600000

opensearch:
  url: ${OPENSEARCH_URL:http://localhost:9200}
  username: ${OPENSEARCH_USER:}
  password: ${OPENSEARCH_PASS:}

connector:
  index-name: ${CONNECTOR_INDEX_NAME:pg-orders}
  batch-size: ${CONNECTOR_BATCH_SIZE:500}
  poll-interval-ms: ${CONNECTOR_POLL_INTERVAL_MS:5000}
  safety-lag-seconds: ${CONNECTOR_SAFETY_LAG_SECONDS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.chartpilot.connector: INFO