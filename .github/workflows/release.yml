name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without v prefix), source taken from tag v<version>"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & push service images to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    strategy:
      matrix:
        service:
          - pg-opensearch-connector
          - mcp-bridge-server
          - agui-adapter
          - mock-llm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: ver
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/chart-pilot-${{ matrix.service }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/chart-pilot-${{ matrix.service }}:latest
      # OSD-with-plugin image is built locally by deploy/scripts/deploy-minikube.sh:
      # it needs the cached OSD bootstrap image (chartpilot/osd-bootstrap:3.10.0).

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.images.outputs.version }}
          generate_release_notes: true