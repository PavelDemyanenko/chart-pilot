name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & push service images to GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - pg-opensearch-connector
          - mcp-bridge-server
          - agui-adapter
          - mock-llm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chart-pilot-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/chart-pilot-${{ matrix.service }}:latest
      # OSD-with-plugin image is built locally by deploy/scripts/deploy-minikube.sh:
      # it needs the cached OSD bootstrap image (chartpilot/osd-bootstrap:3.10.0).

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true