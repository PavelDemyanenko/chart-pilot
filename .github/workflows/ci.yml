name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Services (unit, Testcontainers ITs, ArchUnit, SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B -ntp verify -pl '!e2e-tests'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: services/*/target/surefire-reports
          retention-days: 7

  images:
    name: Docker images (build smoke, root-context Dockerfiles)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - run: docker build -q -t pg-opensearch-connector:ci -f services/pg-opensearch-connector/Dockerfile .
      - run: docker build -q -t mcp-bridge-server:ci -f services/mcp-bridge-server/Dockerfile .
      - run: docker build -q -t agui-adapter:ci -f services/agui-adapter/Dockerfile .
      - run: docker build -q -t mock-llm:ci -f services/mock-llm/Dockerfile .